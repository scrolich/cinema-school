<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление курсами | Админ-панель</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header class="admin-header">
        <div class="admin-header-inner">
            <h2>🎬 Управление курсами</h2>
            <div>
                <a href="/admin/edit.html" class="btn btn-primary btn-sm">+ Новый курс</a>
                <button class="btn btn-outline btn-sm" onclick="logout()">Выйти</button>
                <a href="/" class="btn btn-outline btn-sm">На сайт</a>
            </div>
        </div>
    </header>

    <main class="admin-container">
        <div class="course-table" id="courseTable">
            <p class="loading-text">Загрузка...</p>
        </div>
    </main>

    <script>
        const ADMIN_URL = '/api/admin/courses';
        
        function getToken() {
            return localStorage.getItem('adminToken');
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin/';
        }
        
        async function loadCourses() {
            const container = document.getElementById('courseTable');
            
            try {
                const response = await fetch(ADMIN_URL, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }
                
                const courses = await response.json();
                
                if (courses.length === 0) {
                    container.innerHTML = '<p class="loading-text">Нет курсов. Создайте первый!</p>';
                    return;
                }
                
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th>Мастер</th>
                                <th>Цена</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                courses.forEach(course => {
                    html += `
                        <tr>
                            <td>${course.id}</td>
                            <td>${course.title}</td>
                            <td>${course.category}</td>
                            <td>${course.master}</td>
                            <td>${course.price.toLocaleString()} ₽</td>
                            <td class="actions">
                                <a href="/admin/edit.html?id=${course.id}" class="btn btn-sm btn-outline">✏️</a>
                                <button class="btn btn-sm btn-danger" onclick="deleteCourse(${course.id})">🗑️</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += '</tbody></table>';
                container.innerHTML = html;
                
            } catch (error) {
                container.innerHTML = '<p class="loading-text" style="color:red;">Ошибка загрузки</p>';
            }
        }
        
        async function deleteCourse(id) {
            if (!confirm('Точно удалить этот курс?')) return;
            
            try {
                const response = await fetch(`${ADMIN_URL}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                if (response.ok) {
                    loadCourses(); // Перезагружаем список
                }
            } catch (error) {
                alert('Ошибка удаления');
            }
        }
        
        loadCourses();
    </script>
</body>
</html>
