<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои курсы | Академия КИНО</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <!-- ШАПКА -->
    <header class="header" id="header">
        <div class="header-container">
            <a href="/" class="logo">🎬 Академия КИНО</a>
            <nav class="nav">
                <a href="/#courses" class="nav-link">Курсы</a>
                <a href="/about.html" class="nav-link">О школе</a>
                <a href="/#faq" class="nav-link">FAQ</a>
                <a href="/#contacts" class="nav-link">Контакты</a>
            </nav>
            <button class="btn btn-outline" id="openAuthBtn">Войти</button>
        </div>
    </header>

    <!-- КОНТЕНТ -->
    <main class="dashboard">
        <div class="dashboard-container">
            <h1 class="dashboard-title">👤 Мой кабинет</h1>
            <p class="dashboard-subtitle" id="userName"></p>
            
            <div class="my-courses" id="myCourses">
                <p class="loading-text">Загрузка курсов...</p>
            </div>
        </div>
    </main>

    <!-- МОДАЛКА ВХОДА -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="modal-close" id="closeModal">&times;</button>
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="login">Вход</button>
                <button class="modal-tab" data-tab="register">Регистрация</button>
            </div>
            <form class="auth-form active" id="loginForm">
                <h3 class="form-title">С возвращением!</h3>
                <input type="email" placeholder="Email" required class="form-input">
                <input type="password" placeholder="Пароль" required class="form-input">
                <button type="submit" class="btn btn-primary form-btn">Войти</button>
                <p class="form-message" id="loginMessage"></p>
            </form>
            <form class="auth-form" id="registerForm">
                <h3 class="form-title">Начните обучение!</h3>
                <input type="text" placeholder="Имя" required class="form-input">
                <input type="email" placeholder="Email" required class="form-input">
                <input type="password" placeholder="Пароль (мин. 6 символов)" required class="form-input">
                <button type="submit" class="btn btn-primary form-btn">Зарегистрироваться</button>
                <p class="form-message" id="registerMessage"></p>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
